<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Quizopedia">
  <defs>
    <linearGradient id="bg" x1="12" y1="8" x2="52" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1e2630"/>
      <stop offset="1" stop-color="#121821"/>
    </linearGradient>
    <linearGradient id="accent" x1="18" y1="14" x2="48" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f0a06a"/>
      <stop offset="1" stop-color="#d9773a"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Geometric sans capital Q (tail starts inside the counter) -->
  <ellipse
    cx="30.5"
    cy="29"
    rx="14.8"
    ry="16"
    fill="none"
    stroke="url(#accent)"
    stroke-width="6.4"
  />
  <line
    x1="33.8"
    y1="35.2"
    x2="46.5"
    y2="49"
    stroke="url(#accent)"
    stroke-width="6.4"
    stroke-linecap="butt"
  />
</svg>
